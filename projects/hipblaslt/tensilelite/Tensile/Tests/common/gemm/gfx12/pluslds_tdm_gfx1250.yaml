#
# Derived from tdm_gfx1250.yaml to exercise the PlusLdsBuf tuning parameter.
# PlusLdsBuf=1 forces NumLdsBlk = PrefetchGlobalRead+1 (=3) when PGR==2 for TDM
# kernels (enableTDMA && enableTDMB via TDMInst=3) under ScheduleIterAlg 0 or 4
# (_ScheduleIterAlg==0; SIA3/subtile excluded), setting IncLdsBufSwitch=True and
# 1LDSBuffer=0. PlusLdsBuf=0 is the unchanged baseline (NumLdsBlk=2). Both values
# are forked in a single benchmark group so all four solutions (PlusLdsBuf x
# ScheduleIterAlg) are generated, benchmarked, and numerically validated
# (NumElementsToValidate=-1) side by side.
#
# K is chosen large (1024/512/1000 with DepthU=64 => ~8-16 unroll iterations) so
# the steady-state main loop actually rotates through all 3 LDS buffers
# (write/read block offset cycles 0 -> blk -> 2*blk -> 0). 1000 is not a multiple
# of DepthU=64, so it also exercises the tail loop.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch
GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: False
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  PruneSparseMode: 0
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeD: 2
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  NumWarmups: 0
  EnqueuesPerSync: 1
  PrintWinnersOnly: False
  Architecture: gfx1250
  CpuThreads: 1
  KeepBuildTmp: True
  PrintLevel: 2
  CodeObjectVersion: "4"
  ROCmAgentEnumeratorPath: rocm_agent_enumerator

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1,  1, 1,  2, 2]
        - DepthU: [64]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - TDMInst: [3]
        - LDSTrInst: [False]
        - StaggerU: [0]
        - ScheduleIterAlg: [0, 4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - PlusLdsBuf: [0, 1]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [8]
        - 1LDSBuffer: [0]
        - SourceSwap: [false]
        - DirectToVgprSparseMetadata: [false]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [false]
        - GroupLoadStore: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64, 64, 1, 1024]
          - Exact: [128, 128, 1, 512]
          - Exact: [64, 64, 1, 1000]
        - ActivationArgs:
          - [Enum: none]
